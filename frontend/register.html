<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LeaveEase - Employee Register</title>

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <div class="page-container">

        <!-- Logo / Title -->

        <div class="logo-section">

            
            <h1>LeaveEase</h1>

            <p>
                Create your employee account and start
                managing your leaves efficiently.
            </p>

        </div>

        <!-- Register Card -->

        <div class="register-card">

            <h2>
                Employee Register
            </h2>

            <form id="registerForm">

                <!-- First Name -->

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        required>

                </div>

                <!-- Last Name -->

                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        required>

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <!-- Employee ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Example: EMP001"
                        required>

                </div>

                <!-- Department -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="Engineering">
                            Engineering
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Operations">
                            Operations
                        </option>

                    </select>

                </div>

                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                        required>

                        <small class="password-info">
                        Minimum 8 characters, 1 uppercase letter,
                        1 lowercase letter, 1 number and
                        1 special character.
                    </small> 

                </div>

                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required>

                </div>

                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>

            <div class="bottom-text">

                Already have an account?

                <a href="login.html?role=employee">

                    Login

                </a>

            </div>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
