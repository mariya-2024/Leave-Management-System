<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Leave History</title>

    <link rel="stylesheet"
        href="css/leave-history.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand">

                <img
                    src="assets/logo.png"
                    class="logo"
                    alt="Logo">

                <span>LeaveEase</span>

            </div>

            <ul>

                <li id="dashboardBtn">
                    Dashboard
                </li>

                <li id="applyLeaveBtn">
                    Apply Leave
                </li>

                <li class="active">
                    My Leaves
                </li>

                <li id="calendarBtn">
                    Calendar
                </li>

            </ul>

        </div>

        <div class="sidebar-bottom">

            <div class="profile-section">

                <p id="employeeName">
                    John Doe
                </p>

                <span>
                    Employee
                </span>

            </div>

            <button id="logoutBtn">

                Logout

            </button>

        </div>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="page-container">

            <div class="top-bar">

                <div>

                    <h1>

                        My Leave History

                    </h1>

                    <p class="subtitle">

                        View all your leave requests and their current status.

                    </p>

                </div>

                <button
                    class="new-btn"
                    id="newRequestBtn">

                    + New Request

                </button>

            </div>

            <!-- Filters -->

            <div class="filters">

                <select id="typeFilter">

                    <option value="all">
                        All Types
                    </option>

                    <option value="Casual Leave">
                        Casual Leave
                    </option>

                    <option value="Sick Leave">
                        Sick Leave
                    </option>

                    <option value="Annual Leave">
                        Annual Leave
                    </option>

                </select>

                <select id="statusFilter">

                    <option value="all">
                        All Status
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Approved">
                        Approved
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

            </div>

            <!-- Table -->

            <div class="table-card">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Leave Type
                            </th>

                            <th>
                                Start Date
                            </th>

                            <th>
                                End Date
                            </th>

                            <th>
                                Days
                            </th>

                            <th>
                                Reason
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody id="historyTable">

                        <!-- Filled by JS -->

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

    <script src="js/leave-history.js"></script>

</body>

</html>
