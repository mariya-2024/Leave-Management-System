<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Leave Requests
    </title>

    <link
        rel="stylesheet"
        href="css/leave-requests.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand">

                <img
                    src="assets/logo.png"
                    class="logo"
                    alt="Logo">

                <span>
                    LeaveEase
                </span>

            </div>

            <ul>

                <li
                    id="dashboardBtn">

                    Dashboard

                </li>

                <li class="active">

                    Leave Requests

                </li>

                <li>

                    Team Calendar

                </li>

            </ul>

        </div>

        <div class="sidebar-bottom">

            <div class="profile-section">

                <p id="managerName">

                    Manager

                </p>

                <span>

                    Manager

                </span>

            </div>

            <button id="logoutBtn">

                Logout

            </button>

        </div>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="page-container">

            <!-- Top -->

            <div class="top-bar">

                <div>

                    <h1>

                        Leave Requests

                    </h1>

                    <p class="subtitle">

                        Review and manage employee leave requests.

                    </p>

                </div>

            </div>

            <!-- Table Card -->

            <div class="table-card">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Employee
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Leave Type
                            </th>

                            <th>
                                Start Date
                            </th>

                            <th>
                                End Date
                            </th>

                            <th>
                                Reason
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="requestsTable">

                        <!-- Filled by JS -->

                    </tbody>

                </table>

            </div>

        </div>

    </main>
    
   <script src="js/auth.js"></script>

    <script src="js/leave-requests.js"></script>

</body>

</html>
