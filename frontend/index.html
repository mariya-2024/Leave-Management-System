<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeaveEase</title>

    <link rel="stylesheet" href="css/landing.css">

</head>

<body>

    <div class="container">

        <div class="logo">
<img src="assets/logo.png" alt="Logo" class="logo">
</div>
        <h1>LeaveEase</h1>

        <p class="subtitle">
            A simple, warm leave management system for teams.
            <br>
            Apply, approve and track leaves — all in one place.
        </p>

        <div class="cards">

            <div class="role-card" id="employeeCard">
                <img src="assets/employee.png" alt="Employee" class="role-image">
                <h2>Employee</h2>

                <p>
                    Apply for leave and
                    <br>
                    track your balance
                </p>

            </div>

            <div class="role-card" id="managerCard">
                <img src="assets/manager.png" alt="Manager" class="role-image">

                <h2>Manager</h2>

                <p>
                    Review and manage
                    <br>
                    your team's requests
                </p>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
